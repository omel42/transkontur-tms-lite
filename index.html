<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18221d" />
    <meta name="description" content="TMS Lite для небольших автоперевозчиков: заявки, рейсы, экипажи и экономика." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <title>ТрансКонтур — TMS Lite</title>
  </head>
  <body>
    <div id="workspace" class="workspace">
      <aside class="sidebar" aria-label="Основная навигация">
        <a class="brand" href="./" aria-label="ТрансКонтур, главная">
          <span class="brand-mark" aria-hidden="true">ТК</span>
          <span><b>ТрансКонтур</b><small>TMS Lite</small></span>
        </a>

        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard">
            <span aria-hidden="true">⌂</span> Обзор
          </button>
          <button class="nav-item" data-view="trips">
            <span aria-hidden="true">↗</span> Рейсы
            <span class="nav-count" id="active-count">0</span>
          </button>
          <button class="nav-item" data-view="fleet">
            <span aria-hidden="true">▣</span> Автопарк
          </button>
          <button class="nav-item" data-view="reports">
            <span aria-hidden="true">◫</span> Экономика
          </button>
          <button class="nav-item" data-view="settings">
            <span aria-hidden="true">⚙</span> Данные
          </button>
        </nav>

        <div class="sidebar-card">
          <span class="eyebrow">Документы</span>
          <strong><span id="docs-count">0</span> рейса требуют внимания</strong>
          <button class="text-button" data-view="trips" data-status="delivered">Проверить →</button>
        </div>

        <div class="profile">
          <span class="avatar">АК</span>
          <span><b>Алексей</b><small>Диспетчер</small></span>
          <button class="icon-button" title="Демо-профиль">•••</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu icon-button" id="mobile-menu" aria-label="Открыть меню">☰</button>
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="Номер, клиент или город" autocomplete="off" />
            <kbd>⌘ K</kbd>
          </label>
          <div class="top-actions">
            <span class="connection"><i></i> Локально</span>
            <button class="button primary" data-action="new-trip"><span>＋</span> Новый рейс</button>
          </div>
        </header>
        <section id="app" class="page" aria-live="polite"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="trip-modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="trip-modal-title">
        <div class="modal-head">
          <div>
            <span class="eyebrow">Новая заявка</span>
            <h2 id="trip-modal-title">Создать рейс</h2>
          </div>
          <button class="icon-button" data-action="close-modal" aria-label="Закрыть">×</button>
        </div>
        <form id="trip-form">
          <div class="form-section">
            <h3>Клиент и маршрут</h3>
            <div class="form-grid">
              <label class="field wide"><span>Клиент *</span><input name="client" required placeholder="ООО «Компания»" /></label>
              <label class="field"><span>Контакт</span><input name="contact" placeholder="Имя" /></label>
              <label class="field"><span>Телефон</span><input name="phone" inputmode="tel" placeholder="+7 900 000-00-00" /></label>
              <label class="field"><span>Откуда *</span><input name="from" required placeholder="Москва" /></label>
              <label class="field"><span>Куда *</span><input name="to" required placeholder="Казань" /></label>
              <label class="field"><span>Погрузка *</span><input name="pickupAt" type="datetime-local" required /></label>
              <label class="field"><span>Выгрузка *</span><input name="deliveryAt" type="datetime-local" required /></label>
            </div>
          </div>
          <div class="form-section">
            <h3>Груз и экономика</h3>
            <div class="form-grid">
              <label class="field wide"><span>Груз *</span><input name="cargo" required placeholder="Что везём" /></label>
              <label class="field"><span>Вес, т</span><input name="weight" type="number" min="0" step="0.1" placeholder="20" /></label>
              <label class="field"><span>Цена клиенту, ₽ *</span><input name="price" type="number" min="0" required placeholder="120000" /></label>
              <label class="field"><span>Плановые затраты, ₽ *</span><input name="plannedCost" type="number" min="0" required placeholder="85000" /></label>
            </div>
          </div>
          <div class="form-section">
            <h3>Экипаж</h3>
            <div class="form-grid">
              <label class="field"><span>Водитель</span><select name="driverId" id="driver-select"></select></label>
              <label class="field"><span>Автомобиль</span><select name="vehicleId" id="vehicle-select"></select></label>
              <label class="field wide"><span>Комментарий</span><textarea name="comment" rows="3" placeholder="Особые условия, контакты на точках"></textarea></label>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="button secondary" data-action="close-modal">Отмена</button>
            <button type="submit" class="button primary">Создать рейс</button>
          </div>
        </form>
      </section>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden>
      <aside class="drawer" id="trip-drawer" aria-label="Карточка рейса"></aside>
    </div>

    <input id="import-file" type="file" accept="application/json" hidden />
    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./src/app.js?v=3"></script>
  </body>
</html>
